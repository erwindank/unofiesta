<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tab icon: same picture as the app icon (icon.svg), two cards and confetti on the
       night-blue table, with rounded corners for the browser tab. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#3a1a5a"/><stop offset="1" stop-color="#0d1e42"/></radialGradient>
  </defs>
  <rect width="100" height="100" rx="14" fill="url(#bg)"/>
  <g transform="rotate(-14 50 55)">
    <rect x="22" y="24" width="36" height="54" rx="6" fill="#1040B8" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <text x="40" y="60" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" text-anchor="middle" fill="#fff">+2</text>
  </g>
  <g transform="rotate(10 50 55)">
    <rect x="42" y="24" width="36" height="54" rx="6" fill="#C81515" stroke="#fff" stroke-width="2.4"/>
    <rect x="46" y="28" width="28" height="46" rx="4" fill="none" stroke="#ffd0ea" stroke-opacity=".8" stroke-dasharray="3 2"/>
    <text x="60" y="61" font-size="20" text-anchor="middle">☝️</text>
  </g>
  <g>
    <rect x="16" y="14" width="5" height="9" rx="1.5" fill="#D4A800" transform="rotate(25 18 18)"/>
    <rect x="78" y="12" width="5" height="9" rx="1.5" fill="#ff5fb0" transform="rotate(-30 80 16)"/>
    <rect x="84" y="80" width="5" height="9" rx="1.5" fill="#189A20" transform="rotate(40 86 84)"/>
    <circle cx="12" cy="82" r="3" fill="#4a7eff"/>
    <circle cx="50" cy="10" r="2.6" fill="#fff"/>
    <circle cx="90" cy="45" r="2.4" fill="#D4A800"/>
  </g>
</svg>
